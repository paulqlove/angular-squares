name: Delete preview (PR closed)

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Delete this PR's preview channel
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SQUARES_4E4F7 }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm i -g firebase-tools@latest --silent
          out=$(firebase hosting:channel:list --project squares-4e4f7 --json || true)
          # Channel ids are pr<number>-<branch prefix>; delete any that belong to this PR.
          ids=$(echo "$out" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(j.status!=='success'){console.error(s);process.exit(1)}for(const c of j.result.channels){const id=c.name.split('/').pop();if(id.startsWith('pr'+process.env.PR+'-'))console.log(id)}})")
          if [ -z "$ids" ]; then echo "No preview channel for PR $PR"; exit 0; fi
          for c in $ids; do firebase hosting:channel:delete "$c" --force --project squares-4e4f7; done
