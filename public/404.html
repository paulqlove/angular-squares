<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page not found — QuarterScore</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: Inter;
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("/assets/fonts/inter-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: Archivo;
      font-style: normal;
      font-weight: 100 900;
      font-stretch: 100%;
      font-display: swap;
      src: url("/assets/fonts/archivo-latin.woff2") format("woff2");
    }
    :root {
      --bg: #f1f5f9;
      --heading: #334155;
      --muted: #475569;
      --button: #047857;
      --button-hover: #065f46;
    }
    .dark {
      --bg: #0f172a;
      --heading: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--heading);
      font-family: Inter, system-ui, sans-serif;
    }
    main { max-width: 28rem; padding: 1.5rem; text-align: center; }
    h1 {
      font-family: Archivo, Inter, system-ui, sans-serif;
      font-size: 1.5rem;
      line-height: 2rem;
      margin: 1.5rem 0 0.5rem;
    }
    p { margin: 0 0 1.5rem; color: var(--muted); }
    a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      background: var(--button);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { background: var(--button-hover); }
    .logo { height: 2.5rem; width: auto; }
    .logo-dark { display: none; }
    .dark .logo-light { display: none; }
    .dark .logo-dark { display: inline; }
  </style>
  <script>
    (function () {
      var stored = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (stored === 'dark' || (stored === 'system' && prefersDark) || (!stored && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body>
  <main>
    <img class="logo logo-light" src="/assets/brand/lockup-horizontal.svg" alt="QuarterScore" width="384" height="48">
    <img class="logo logo-dark" src="/assets/brand/lockup-horizontal-reversed.svg" alt="QuarterScore" width="384" height="48">
    <h1>Page not found</h1>
    <p>That address isn't part of QuarterScore.</p>
    <a href="/">Back to home</a>
  </main>
</body>
</html>
