<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page not found — Quarter Score</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    @font-face {
      font-family: Roboto;
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("/assets/fonts/roboto-latin.woff2") format("woff2");
    }
    :root {
      --bg: #f1f5f9;
      --heading: #334155;
      --muted: #64748b;
      --button: #0ea5e9;
      --button-hover: #0284c7;
    }
    .dark {
      --bg: #0f172a;
      --heading: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--heading);
      font-family: Roboto, system-ui, sans-serif;
    }
    main { max-width: 28rem; padding: 1.5rem; text-align: center; }
    img { height: 4rem; width: auto; }
    h1 { font-size: 1.5rem; line-height: 2rem; margin: 1.5rem 0 0.5rem; }
    p { margin: 0 0 1.5rem; color: var(--muted); }
    a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      background: var(--button);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { background: var(--button-hover); }
  </style>
  <script>
    (function () {
      var stored = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (stored === 'dark' || (stored === 'system' && prefersDark) || (!stored && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body>
  <main>
    <img src="/assets/logo.webp" alt="Quarter Score" width="114" height="120">
    <h1>Page not found</h1>
    <p>That address isn't part of Quarter Score.</p>
    <a href="/">Back to home</a>
  </main>
</body>
</html>
