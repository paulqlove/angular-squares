<button
  type="button"
  class="flex w-full items-center gap-3 p-3.5 text-left focus-visible:outline-offset-[-3px]"
  [attr.aria-expanded]="isOpen()"
  (click)="players.toggleOpen(player().key)"
>
  <span class="min-w-0 flex-1">
    <span translate="no" class="block truncate font-medium">{{ player().name }}</span>
    <span class="mt-0.5 block font-semibold tabular-nums">{{ player().points }} pts</span>
    @if (player().newSquares) {
      <span class="block text-xs tabular-nums text-qs-warn">+{{ player().newSquares }} new {{ player().newSquares === 1 ? 'square' : 'squares' }}</span>
    } @else if (player().sameNameIndex) {
      <span class="block text-xs text-qs-muted">Same name, account {{ player().sameNameIndex }}</span>
    }
  </span>
  <ng-icon [name]="isOpen() ? 'heroChevronUp' : 'heroChevronDown'" class="text-xl text-qs-muted" aria-hidden="true"></ng-icon>
</button>
@if (isOpen()) {
  <div appPlayerGames [player]="player()" [phone]="true" animate.enter="qs-row-in"></div>
}
