<button type="button" class="flex w-full items-start gap-2 text-left focus-visible:outline-none" [attr.aria-expanded]="isOpen()">
  <span class="min-w-0 flex-1">
    <span translate="no" class="block truncate font-medium">{{ player().name }}</span>
    <span class="mt-0.5 block font-semibold tabular-nums sm:hidden">{{ player().points }} pts</span>
    @if (beat()) {
      <span class="flex items-center gap-1 whitespace-nowrap text-xs font-medium text-qs-ink">
        <ng-icon name="heroCheck" class="qs-check-in shrink-0 text-sm" aria-hidden="true"></ng-icon>All confirmed
      </span>
    } @else if (player().newSquares) {
      <span class="block text-xs tabular-nums text-qs-warn">+{{ player().newSquares }} new {{ player().newSquares === 1 ? 'square' : 'squares' }}</span>
    } @else if (player().sameNameIndex) {
      <span class="block text-xs text-qs-muted">Same name, account {{ player().sameNameIndex }}</span>
    } @else if (player().otherNames.length) {
      <span translate="no" class="block truncate text-xs text-qs-muted">also {{ player().otherNames.join(', ') }}</span>
    }
  </span>
  <span class="hidden shrink-0 text-right sm:block">
    <span class="block font-semibold tabular-nums">{{ player().points }} pts</span>
    <span class="block text-xs tabular-nums text-qs-muted">{{ player().squares }} sq</span>
  </span>
  <ng-icon [name]="isOpen() ? 'heroChevronUp' : 'heroChevronDown'" class="shrink-0 text-xl text-qs-muted" aria-hidden="true"></ng-icon>
</button>
<!-- Desktop: a tile per game, so a game sits in the same spot on every card -->
<div class="mt-3 hidden flex-wrap items-center gap-x-4 gap-y-1 sm:flex">
  <div appPlayerTiles [player]="player()" [boardIds]="boardIds()"></div>
  <span class="whitespace-nowrap text-sm tabular-nums text-qs-muted">{{ player().games.length }} {{ player().games.length === 1 ? 'game' : 'games' }}</span>
</div>
