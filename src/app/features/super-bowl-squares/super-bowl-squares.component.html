<!-- Loading State -->
@if (state.isLoading() || state.gameNotFound()) {
  <!-- Loading: the page's own shape, so moving between boards does not flash a spinner. A missing game keeps it up while the page moves to the landing page or dashboard. -->
  <app-shared-header variant="fixed" heading="p"></app-shared-header>
  <main class="qs-skel-delay mx-auto max-w-[1600px] px-1 pb-16 pt-2 sm:px-5">
    <app-game-skeleton [size]="ui.skeletonSize()" [fade]="ui.skeletonFade()"></app-game-skeleton>
  </main>
} @else {
  <!-- Main Game View -->
  <app-shared-header variant="fixed" heading="p">
    <button type="button" (click)="ui.showShareModal.set(true)" data-walkthrough="share" class="flex min-h-11 min-w-11 items-center justify-center gap-2 rounded-btn p-2.5 text-qs-tile-muted transition-colors hover:bg-white/10 hover:text-qs-tile-ink sm:px-3" aria-label="Share">
      <ng-icon name="heroShare" class="text-xl"></ng-icon>
      <span class="qs-label hidden sm:inline">Share</span>
    </button>
    @if (state.currentUser()) {
      <app-your-games-menu [currentGameId]="state.gameId"></app-your-games-menu>
    }
    <app-help-menu (tour)="ui.startWalkthrough()"></app-help-menu>
    @if (state.currentUser()) {
      <app-profile-menu [allowNameEdit]="!!state.currentUser()?.isGuest" [nameEditViaDialog]="true" walkthroughTarget="player-name" (editName)="names.openNameEditModal()" [presentGameId]="state.isHost() ? state.gameId : null" (tour)="ui.startWalkthrough()"></app-profile-menu>
    } @else {
      <button type="button" (click)="ui.showAuthModal.set(true)" class="qs-btn qs-btn-primary">Sign in</button>
    }
  </app-shared-header>

  <!-- Host tools: floating bar, bottom center, owner and co-host only -->
  @if (state.isHost()) {
    <div appHostToolbar class="qs-dockable no-print fixed inset-x-3 bottom-[calc(0.75rem+env(safe-area-inset-bottom))] z-[90] mx-auto sm:bottom-4 sm:max-w-fit" appDockAtEnd data-walkthrough="host-tools"></div>
  }

  <app-board-settings-dialogs></app-board-settings-dialogs>

  <main class="mx-auto max-w-[1600px] px-1 pb-16 pt-2 sm:px-5" [class.pb-32]="state.isHost()" #boardPage>
    <div class="space-y-6">
      <!-- Game Info Bar -->
      <div appGameInfoBar class="flex flex-wrap items-center justify-between gap-2 px-3 py-2"></div>

      <!-- Board + players -->
      <div class="grid grid-cols-1 gap-8 px-3 lg:grid-cols-12">
        <section appBoardSection class="lg:col-span-7" data-walkthrough="game-board" aria-labelledby="board-heading"></section>
        <section appPlayersSection class="lg:relative lg:col-span-5" data-walkthrough="players-list" aria-labelledby="players-heading"></section>
      </div>

      <!-- 03 Winners -->
      <section class="px-3" data-walkthrough="winners-payouts" (click)="$event.stopPropagation()">
        <app-winners-and-payouts
          [winners]="state.winners"
          [quarterPayouts]="state.quarterPayouts"
          [emptyQuarterRule]="state.emptyQuarterRule"
          [completedQuarters]="state.completedQuarterCount()"
          [playerColors]="state.playerColors"
          [totalPot]="state.totalPot"
          [scores]="state.scores"
          [homeTeam]="state.homeTeam"
          [awayTeam]="state.awayTeam"
          [gameOver]="state.isGameOver()"
          [startedQuarters]="state.startedQuarterCount()"
          (quarterClick)="ui.toggleQuarterHighlight($event)">
        </app-winners-and-payouts>
      </section>

      @if (state.showAd()) {
        <section class="px-3">
          <app-ad-slot></app-ad-slot>
        </section>
      }

      <!-- Alert notifications -->
      @if (ui.showAlert) {
        <div
          class="fixed p-4 -translate-x-1/2 border border-qs-line rounded-card shadow-pop bottom-40 left-1/2 w-72 bg-qs-bad-soft text-qs-bad"
          role="alert">
          <div class="flex">
            <div class="flex-shrink-0">
              <svg class="w-5 h-5 text-qs-bad" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
              </svg>
            </div>
            <div class="ml-3">
              <p class="text-sm text-qs-bad">
                {{ ui.alertMessage }}
              </p>
            </div>
          </div>
        </div>
      }

      <app-payment-dialog
        #paymentDialog
        (onPaidStatusChange)="players.onPaidPlayersChange($event)"
        (playerRemoved)="players.onPlayerRemoved($event)">
      </app-payment-dialog>
    </div>
  </main>

  <app-game-page-dialogs></app-game-page-dialogs>
}
