@if (getPlayerEntries().length > 0) {
  <ul class="divide-y divide-qs-line">
    @for (entry of getPlayerEntries(); track entry.player) {
      <li>
        <button
          type="button"
          class="flex w-full items-center justify-between gap-3 px-4 py-3 text-left transition-colors hover:bg-qs-panel-2 focus-visible:outline-offset-[-3px] sm:px-5"
          [class.bg-qs-panel-2]="selectedPlayer === entry.player"
          (click)="onPlayerClick(entry.player)"
          [appTooltip]="'Highlight their squares on the board'"
          [attr.aria-pressed]="selectedPlayer === entry.player">
          <div class="flex min-w-0 flex-wrap items-center gap-2">
            <span class="h-3 w-3 shrink-0 rounded-full" [class]="playerColors[entry.player]" aria-hidden="true"></span>
            <span class="truncate font-medium text-qs-ink">{{ entry.player }}</span>
            @if (entry.probability !== null) {
              <span class="qs-badge" [appTooltip]="'Chance of holding a winning square, from past scores'">{{ entry.probability }}%</span>
            }
            @if (paidPlayers.has(entry.player)) {
              <span class="qs-badge qs-badge-ok">Confirmed</span>
            } @else if (shouldShowUnconfirmed(entry.player)) {
              <span class="qs-badge qs-badge-warn">Not confirmed</span>
            }
          </div>
          <div class="shrink-0 text-right">
            <p class="font-semibold tabular-nums text-qs-ink">{{ entry.stats.squares }} <span class="text-sm font-normal text-qs-muted">{{ entry.stats.squares === 1 ? 'square' : 'squares' }}</span></p>
            <p class="qs-label text-xs text-qs-muted">{{ entry.stats.total | number: '1.0-2' }} pts</p>
          </div>
        </button>
      </li>
    }
  </ul>
} @else {
  <p class="px-5 py-8 text-center text-qs-muted">No players yet. Tap an open square to pick it.</p>
}
