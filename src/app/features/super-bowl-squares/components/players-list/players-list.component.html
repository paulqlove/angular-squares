<div class="rounded-lg">
  <div class="space-y-2 max-h-[387px] overflow-y-auto">
    @if (getPlayerEntries().length > 0) {
      @for (entry of getPlayerEntries(); track entry.player) {
        <button
          type="button"
          class="w-full flex items-center justify-between gap-3 p-2 rounded bg-card hover:bg-card-hover focus:ring-2 focus:ring-secondary-500 focus:outline-none text-left"
          [class.bg-card-hover]="selectedPlayer === entry.player"
          (click)="onPlayerClick(entry.player)"
          [appTooltip]="'Click to highlight squares on the board'"
          [attr.aria-pressed]="selectedPlayer === entry.player">
          <div class="flex flex-wrap items-center gap-2 min-w-0">
            <div class="w-4 h-4 rounded shrink-0" [class]="playerColors[entry.player]" aria-hidden="true"></div>
            <span class="text-default">{{ entry.player }}</span>
            @if (entry.probability !== null) {
              <span class="px-2 py-0.5 text-xs font-medium bg-blue-100 text-blue-800 rounded-full"
                    [appTooltip]="'Chance this player’s squares match the score, from past games'">
                {{ entry.probability }}%
              </span>
            }
            @if (confirmedNames.has(entry.player)) {
              <span class="px-2 py-0.5 text-xs font-medium bg-green-100 text-green-800 rounded-full">
                {{ statusLabel }}
              </span>
            }
          </div>
          <div class="text-right shrink-0">
            <div class="text-default font-medium">{{ entry.stats.squares }}&nbsp;{{ entry.stats.squares === 1 ? 'square' : 'squares' }}</div>
          </div>
        </button>
      }
    } @else {
      <p class="text-muted text-center py-4">No players yet</p>
    }
  </div>
</div>
