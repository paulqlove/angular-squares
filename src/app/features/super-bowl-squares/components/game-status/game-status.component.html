<div class="p-4 sm:p-5">
  <dl class="grid grid-cols-4 gap-3">
    <div>
      <dt class="qs-label text-xs text-qs-muted">Picked</dt>
      <dd class="mt-1 text-xl font-semibold tabular-nums text-qs-ink">{{ filledSquares }}</dd>
    </div>
    <div>
      <dt class="qs-label text-xs text-qs-muted">Open</dt>
      <dd class="mt-1 text-xl font-semibold tabular-nums text-qs-ink">{{ remainingSquares }}</dd>
    </div>
    <div>
      <dt class="qs-label text-xs text-qs-muted">Players</dt>
      <dd class="mt-1 text-xl font-semibold tabular-nums text-qs-ink">{{ totalPlayers }}</dd>
    </div>
    <div>
      <dt class="qs-label text-xs text-qs-muted">Confirmed</dt>
      <dd class="mt-1 text-xl font-semibold tabular-nums text-qs-ink">{{ confirmedPlayers }}<span class="text-sm font-normal text-qs-muted">/{{ totalPlayers }}</span></dd>
    </div>
  </dl>
  <div class="mt-4 h-1.5 w-full overflow-hidden rounded-full bg-qs-panel-2" role="progressbar" [attr.aria-valuenow]="percentPaid" aria-valuemin="0" aria-valuemax="100" aria-label="Players confirmed">
    <div class="h-full bg-qs-accent transition-all" [ngStyle]="{ width: percentPaid + '%' }"></div>
  </div>
</div>
