<div class="bg-qs-panel rounded-lg p-4">
  <h2 class="text-base sm:text-lg font-bold mb-2 sm:mb-4 text-qs-ink">Quarter {{ quarter }}</h2>
  <div class="space-y-2 sm:space-y-4">
      <div class="flex items-center justify-between gap-2">
        <span class="w-32 text-qs-ink capitalize">{{ awayTeam || 'Away' }}</span>
        <input type="number" [(ngModel)]="scores.away" 
               (ngModelChange)="onScoreChange()"
               class="w-16 bg-qs-panel-2 text-qs-ink border rounded p-2 text-center focus:outline-none focus:ring-2 focus:ring-qs-accent">
      </div>
    <div class="flex items-center justify-between gap-2">
      <span class="w-32 text-qs-ink capitalize">{{ homeTeam || 'Home' }}</span>
      <input type="number" [(ngModel)]="scores.home" 
             (ngModelChange)="onScoreChange()"
             class="w-16 bg-qs-panel-2 text-qs-ink border rounded p-2 text-center focus:outline-none focus:ring-2 focus:ring-qs-accent">
    </div>
  </div>
</div>
