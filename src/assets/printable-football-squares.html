<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Squares - QuarterScore</title>
  <style>
    @page {
      size: letter landscape;
      margin: 0.5in;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff;
      color: #0f172a;
    }

    .page {
      width: 10in;
      height: 7.5in;
      padding: 0.25in;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.3in;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 24px;
      height: 24px;
      background: #047857;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 16px;
      height: 16px;
      fill: white;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 600;
      color: #0f172a;
    }

    .url {
      font-size: 12px;
      color: #64748b;
    }

    .teams {
      display: flex;
      gap: 1in;
      margin-bottom: 0.2in;
      font-size: 14px;
    }

    .team-label {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .team-label strong {
      font-weight: 600;
    }

    .team-line {
      border-bottom: 1px solid #0f172a;
      width: 2in;
      display: inline-block;
    }

    .board-container {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .board {
      display: grid;
      grid-template-columns: 0.5in repeat(10, 1fr);
      grid-template-rows: 0.5in repeat(10, 1fr);
      gap: 1px;
      background: #0f172a;
      border: 2px solid #0f172a;
      border-radius: 4px;
      overflow: hidden;
      flex: 1;
    }

    .cell {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 500;
    }

    .header-cell {
      background: #e2e8f0;
      color: #64748b;
      font-weight: 600;
      font-size: 12px;
      border: 1px solid #cbd5e1;
    }

    .corner-cell {
      background: #f1f5f9;
      font-size: 9px;
      color: #64748b;
      flex-direction: column;
      line-height: 1.3;
    }

    .footer {
      margin-top: 0.2in;
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #64748b;
    }

    .instructions {
      max-width: 6in;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1" fill="white"/>
            <rect x="14" y="3" width="7" height="7" rx="1" fill="white"/>
            <rect x="3" y="14" width="7" height="7" rx="1" fill="white"/>
            <rect x="14" y="14" width="7" height="7" rx="1" fill="white"/>
          </svg>
        </div>
        <span class="logo-text">QuarterScore</span>
      </div>
      <span class="url">quarterscore.com</span>
    </div>

    <div class="teams">
      <div class="team-label">
        <strong>Home team (columns &rarr;):</strong>
        <span class="team-line"></span>
      </div>
      <div class="team-label">
        <strong>Away team (rows &darr;):</strong>
        <span class="team-line"></span>
      </div>
    </div>

    <div class="board-container">
      <div class="board">
        <!-- Corner cell -->
        <div class="cell corner-cell">
          <span>AWAY &darr;</span>
          <span>HOME &rarr;</span>
        </div>
        <!-- Top header row (empty for numbers) -->
        <div class="cell header-cell"></div>
        <div class="cell header-cell"></div>
        <div class="cell header-cell"></div>
        <div class="cell header-cell"></div>
        <div class="cell header-cell"></div>
        <div class="cell header-cell"></div>
        <div class="cell header-cell"></div>
        <div class="cell header-cell"></div>
        <div class="cell header-cell"></div>
        <div class="cell header-cell"></div>

        <!-- Row 1 -->
        <div class="cell header-cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>

        <!-- Row 2 -->
        <div class="cell header-cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>

        <!-- Row 3 -->
        <div class="cell header-cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>

        <!-- Row 4 -->
        <div class="cell header-cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>

        <!-- Row 5 -->
        <div class="cell header-cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>

        <!-- Row 6 -->
        <div class="cell header-cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>

        <!-- Row 7 -->
        <div class="cell header-cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>

        <!-- Row 8 -->
        <div class="cell header-cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>

        <!-- Row 9 -->
        <div class="cell header-cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>

        <!-- Row 10 -->
        <div class="cell header-cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      </div>
    </div>

    <div class="footer">
      <div class="instructions">
        <strong>How to play:</strong> Fill names in squares first. Draw digits 0-9 for columns, then 0-9 for rows.
        At each quarter's end, the last digit of each score finds the winner.
      </div>
      <div>
        Free online boards at <strong>quarterscore.com</strong>
      </div>
    </div>
  </div>
</body>
</html>
